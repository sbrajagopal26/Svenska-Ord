var activeFilter="all";
var GUMROAD_URL="https://4913055919492.gumroad.com/l/svenska-ord";
var FREE_SECTIONS=["core","forskola"];
function renderAll(){
  var main=document.getElementById("main");
  var query=document.getElementById("searchInput").value.toLowerCase().trim();
  main.innerHTML="";
  var total=0;
  for(var s=0;s<SECTIONS.length;s++){
    var sec=SECTIONS[s];
    var isFree=FREE_SECTIONS.indexOf(sec.id)>=0;
    var mfSec=(activeFilter==="all"||activeFilter===sec.id);
    if(!mfSec)continue;
    if(!isFree){
      if(query)continue;
      var lockEl=document.createElement("div");
      lockEl.className="section";
      lockEl.innerHTML='<div class="section-header"><div class="section-dot" style="background:'+sec.color+'"></div><span class="section-title">'+sec.title+'</span><span class="section-count">'+sec.words.length+' words</span></div><div class="word-grid"><div class="lock-card"><div class="lock-emoji">🔒</div><div class="lock-title">'+sec.words.length+' words locked</div><div class="lock-sub">Unlock this category and 37 others with example sentences</div><a href="'+GUMROAD_URL+'" target="_blank" rel="noopener">Get the full pack</a></div></div>';
      main.appendChild(lockEl);
      continue;
    }
    var filtered=[];
    for(var w=0;w<sec.words.length;w++){
      var wd=sec.words[w];
      var ms=!query||wd.sv.toLowerCase().indexOf(query)>=0||wd.en.toLowerCase().indexOf(query)>=0;
      if(ms)filtered.push(wd);
    }
    if(!filtered.length)continue;
    total+=filtered.length;
    var el=document.createElement("div");
    el.className="section";
    el.innerHTML='<div class="section-header"><div class="section-dot" style="background:'+sec.color+'"></div><span class="section-title">'+sec.title+'</span><span class="section-count">'+filtered.length+' words</span></div><div class="word-grid" id="g'+sec.id+'"></div>';
    main.appendChild(el);
    var grid=document.getElementById("g"+sec.id);
    for(var f=0;f<filtered.length;f++){
      (function(wd){
        var c=document.createElement("div");
        c.className="word-card";
        c.innerHTML='<div class="sv">'+wd.sv+'</div><div class="en">'+wd.en+'</div>'+(wd.tip?'<div class="tip">'+wd.tip+'</div>':'')+(wd.ex?'<div class="ex">'+wd.ex+'</div>':'');
        if(wd.tip||wd.ex){
          c.addEventListener("click",function(){
            var was=c.classList.contains("expanded");
            var all=document.querySelectorAll(".word-card.expanded");
            for(var i=0;i<all.length;i++)all[i].classList.remove("expanded");
            if(!was)c.classList.add("expanded");
          });
        }
        grid.appendChild(c);
      })(filtered[f]);
    }
  }
  var st=document.createElement("div");
  st.className="stats";
  st.textContent=total+" words shown — tap any card to see a usage example";
  main.insertBefore(st,main.firstChild);
}
function setFilter(id,btn){
  activeFilter=id;
  var btns=document.querySelectorAll(".filter-btn");
  for(var i=0;i<btns.length;i++)btns[i].classList.remove("active");
  btn.classList.add("active");
  renderAll();
}
(function markLockedFilters(){
  var btns=document.querySelectorAll(".filters .filter-btn");
  for(var i=0;i<btns.length;i++){
    var m=btns[i].getAttribute("onclick").match(/setFilter\('([a-z]+)'/);
    if(!m)continue;
    var id=m[1];
    if(id!=="all"&&FREE_SECTIONS.indexOf(id)<0)btns[i].classList.add("locked");
  }
})();
renderAll();
</script>
